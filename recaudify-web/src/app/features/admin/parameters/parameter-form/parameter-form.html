<div class="p-4 sm:p-8">
  <div class="mb-6">
    <p class="mb-1 text-xs text-gray-400">
      <a routerLink="/admin/parameters" class="hover:text-gray-600">Parámetros</a>
      <span class="mx-1.5">/</span>
      {{ isEdit() ? 'Editar' : 'Nuevo' }}
    </p>
    <h1 class="text-xl font-semibold text-gray-900">
      {{ isEdit() ? 'Editar parámetro' : 'Nuevo parámetro' }}
    </h1>
  </div>

  @if (loading()) {
    <div class="space-y-3 max-w-lg mx-auto">
      <div class="h-64 rounded-xl bg-white border border-gray-200 animate-pulse"></div>
    </div>
  } @else {
    <div class="max-w-lg mx-auto space-y-4">
      @if (error()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <div class="rounded-xl border border-gray-200 bg-white p-6 space-y-5">
        <div>
          <label for="formKey" class="block text-sm font-medium text-gray-700 mb-1.5">Clave</label>
          <input
            type="text"
            id="formKey"
            [(ngModel)]="formKey"
            placeholder="ej. tasa_interes_moratorio"
            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/20 transition-shadow font-mono"
          />
        </div>

        <div>
          <label for="formValue" class="block text-sm font-medium text-gray-700 mb-1.5"
            >Valor</label
          >
          <input
            type="text"
            id="formValue"
            [(ngModel)]="formValue"
            placeholder="ej. 2.5"
            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/20 transition-shadow"
          />
        </div>

        <div>
          <label for="formDescription" class="block text-sm font-medium text-gray-700 mb-1.5"
            >Descripción</label
          >
          <textarea
            id="formDescription"
            [(ngModel)]="formDescription"
            rows="2"
            placeholder="ej. Tasa de interés moratorio para cálculos de recargo"
            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/20 transition-shadow resize-none"
          ></textarea>
        </div>
      </div>

      <div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 py-2">
        <a
          routerLink="/admin/parameters"
          class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
        >
          Cancelar
        </a>
        <button
          (click)="save()"
          [disabled]="saving() || !formKey.trim() || !formValue.trim()"
          class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </div>
  }
</div>
