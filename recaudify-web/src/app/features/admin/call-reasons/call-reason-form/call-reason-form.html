<div class="p-4 sm:p-8">
  <div class="mb-6">
    <p class="mb-1 text-xs text-gray-400">
      <a routerLink="/admin/call-reasons" class="hover:text-gray-600">Motivos de llamada</a>
      <span class="mx-1.5">/</span>
      {{ isEdit() ? 'Editar' : 'Nuevo' }}
    </p>
    <h1 class="text-xl font-semibold text-gray-900">
      {{ isEdit() ? 'Editar motivo' : 'Nuevo motivo' }}
    </h1>
  </div>

  @if (loading()) {
    <div class="space-y-3 max-w-lg mx-auto">
      <div class="h-64 rounded-xl bg-white border border-gray-200 animate-pulse"></div>
    </div>
  } @else {
    <div class="max-w-lg mx-auto space-y-4">
      @if (error()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <div class="rounded-xl border border-gray-200 bg-white p-6 space-y-5">
        <div>
          <label for="formName" class="block text-sm font-medium text-gray-700 mb-1.5"
            >Nombre</label
          >
          <input
            type="text"
            id="formName"
            [(ngModel)]="formName"
            placeholder="ej. Programar Pago"
            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/20 transition-shadow"
          />
        </div>

        <div>
          <label for="formColor" class="block text-sm font-medium text-gray-700 mb-1.5"
            >Color</label
          >
          <div class="flex items-center gap-3">
            <input
              type="color"
              id="formColorPicker"
              [(ngModel)]="formColor"
              class="h-10 w-12 shrink-0 rounded-lg border border-gray-300 bg-white p-1"
            />
            <input
              type="text"
              id="formColor"
              [(ngModel)]="formColor"
              placeholder="ej. green, #16a34a"
              class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/20 transition-shadow"
            />
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            id="formActive"
            [(ngModel)]="formActive"
            class="h-4 w-4 rounded border-gray-300 text-slate-600 focus:ring-slate-500/20"
          />
          <label for="formActive" class="text-sm font-medium text-gray-700">Activo</label>
        </div>
      </div>

      <div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 py-2">
        <a routerLink="/admin/call-reasons" appBtn="secondary"> Cancelar </a>
        <button (click)="save()" [disabled]="saving() || !formName.trim()" appBtn="primary">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </div>
  }
</div>
