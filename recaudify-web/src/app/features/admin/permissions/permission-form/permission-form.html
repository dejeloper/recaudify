<div class="p-4 sm:p-8">
  <!-- Page header -->
  <div class="mb-6">
    <p class="mb-1 text-xs text-gray-400">
      <a routerLink="/admin/permissions" class="hover:text-gray-600">Permisos</a>
      <span class="mx-1.5">/</span>
      {{ isEdit() ? 'Editar' : 'Nuevo' }}
    </p>
    <h1 class="text-xl font-semibold text-gray-900">
      {{ isEdit() ? 'Editar permiso' : 'Nuevo permiso' }}
    </h1>
  </div>

  <!-- Form -->
  @if (loading()) {
    <div class="h-40 max-w-xl rounded-xl bg-white border border-gray-200 animate-pulse"></div>
  } @else {
    <div class="max-w-xl mx-auto space-y-4">
      @if (error()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <div class="rounded-xl border border-gray-200 bg-white p-6 space-y-5">
        <div>
          <label for="formName" class="block text-sm font-medium text-gray-700 mb-1.5"
            >Nombre del permiso</label
          >
          <input
            type="text"
            id="formName"
            [(ngModel)]="formName"
            placeholder="ej. clientes.crear"
            class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/20 transition-shadow"
          />
          <p class="mt-1.5 text-xs text-gray-400">
            Formato <code class="text-gray-500">modulo.accion</code> — solo minúsculas, guion bajo y
            guion.
          </p>
        </div>

        <div
          class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 border-t border-gray-100 pt-4"
        >
          <a routerLink="/admin/permissions" appBtn="secondary"> Cancelar </a>
          <button (click)="save()" [disabled]="saving() || !isValid()" appBtn="primary">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
