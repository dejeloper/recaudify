<div class="p-4 sm:p-8">
  <!-- Page header -->
  <div class="mb-6">
    <p class="mb-1 text-xs text-gray-400">
      <a routerLink="/admin/menu-items" class="hover:text-gray-600">Menú</a>
      <span class="mx-1.5">/</span>
      {{ isEdit() ? 'Editar' : 'Nuevo' }}
    </p>
    <h1 class="text-xl font-semibold text-gray-900">
      {{ isEdit() ? 'Editar ítem de menú' : 'Nuevo ítem de menú' }}
    </h1>
  </div>

  @if (loading()) {
    <div class="space-y-3 max-w-2xl mx-auto">
      <div class="h-20 rounded-xl bg-white border border-gray-200 animate-pulse"></div>
      <div class="h-64 rounded-xl bg-white border border-gray-200 animate-pulse"></div>
    </div>
  } @else {
    <div class="max-w-2xl mx-auto space-y-4">
      @if (error()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <div class="rounded-xl border border-gray-200 bg-white p-6 space-y-4">
        <div>
          <label for="formLabel" class="block text-sm font-medium text-gray-700 mb-1.5">
            Label
          </label>
          <input
            type="text"
            id="formLabel"
            [(ngModel)]="formLabel"
            placeholder="ej. Clientes"
            class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-shadow"
          />
        </div>

        <div>
          <label for="formParentId" class="block text-sm font-medium text-gray-700 mb-1.5">
            Padre
          </label>
          <select
            id="formParentId"
            [(ngModel)]="formParentId"
            class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-shadow bg-white"
          >
            <option value="">— Ninguno (grupo raíz) —</option>
            @for (parent of availableParents(); track parent.id) {
              <option [value]="parent.id">{{ parent.label }}</option>
            }
          </select>
        </div>

        <div>
          <label for="formRoute" class="block text-sm font-medium text-gray-700 mb-1.5">
            Ruta
          </label>
          <input
            type="text"
            id="formRoute"
            [(ngModel)]="formRoute"
            placeholder="/admin/clients (vacío = ítem deshabilitado/placeholder)"
            class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-shadow"
          />
        </div>

        <div>
          <label for="formPermission" class="block text-sm font-medium text-gray-700 mb-1.5">
            Permiso requerido
          </label>
          <select
            id="formPermission"
            [(ngModel)]="formPermission"
            class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-shadow bg-white"
          >
            <option value="">Sin restricción</option>
            @for (perm of allPermissions(); track perm.id) {
              <option [value]="perm.name">{{ perm.name }}</option>
            }
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="formOrder" class="block text-sm font-medium text-gray-700 mb-1.5">
              Orden
            </label>
            <input
              type="number"
              id="formOrder"
              [(ngModel)]="formOrder"
              min="0"
              class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-shadow"
            />
          </div>

          <div class="flex items-end pb-2.5">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input
                type="checkbox"
                [(ngModel)]="formIsActive"
                class="rounded border-gray-300 text-brand-900 focus:ring-brand-500"
              />
              <span class="text-sm text-gray-700">Activo</span>
            </label>
          </div>
        </div>

        <div>
          <label for="formIcons" class="block text-sm font-medium text-gray-700 mb-1.5">
            Ícono (paths SVG, uno por línea)
          </label>
          <textarea
            id="formIcons"
            [(ngModel)]="formIcons"
            rows="3"
            placeholder="M12 4v16m8-8H4"
            class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-shadow font-mono"
          ></textarea>
        </div>
      </div>

      <!-- Acciones -->
      <div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 py-2">
        <a routerLink="/admin/menu-items" appBtn="secondary"> Cancelar </a>
        <button (click)="save()" [disabled]="saving() || !formLabel.trim()" appBtn="primary">
          {{ saving() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </div>
  }
</div>
