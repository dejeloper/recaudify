<div class="p-4 sm:p-8 md:p-10">
  <!-- Page header -->
  <div class="mb-8 border-l-4 border-brand-600 pl-4">
    <h1 class="text-xl font-semibold text-gray-900">Dashboard</h1>
    <p class="mt-0.5 text-sm text-gray-500">
      Bienvenido de vuelta{{ currentUser() ? ', ' + currentUser()!.name : '' }}.
    </p>
  </div>

  <!-- Profile card -->
  @if (currentUser(); as user) {
    <div
      class="max-w-sm rounded-xl border border-gray-200 bg-white p-6 shadow-sm hover:shadow-md transition-shadow"
    >
      <div class="flex items-center gap-4 mb-5">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-full bg-gradient-to-br from-brand-500 to-brand-900 text-base font-semibold text-white shadow-sm shadow-brand-900/20"
        >
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-900">{{ user.name }}</p>
          <p class="text-xs text-gray-400">{{ user.email ?? '—' }}</p>
        </div>
      </div>
      <div class="space-y-2 border-t border-gray-100 pt-4">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Usuario</span>
          <span class="font-medium text-gray-700">{{ user.username }}</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Rol</span>
          <span
            class="inline-flex items-center rounded-md bg-brand-50 px-2 py-0.5 text-xs font-medium text-brand-800 ring-1 ring-brand-100"
          >
            {{ user.roles[0] || '—' }}
          </span>
        </div>
      </div>
    </div>
  } @else {
    <div class="h-40 max-w-sm rounded-xl border border-gray-200 bg-white animate-pulse"></div>
  }
</div>
