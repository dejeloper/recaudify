<div class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
    <span class="font-semibold text-gray-800">Recaudify</span>
    <button
      (click)="logout()"
      class="text-sm text-red-600 hover:underline"
    >
      Cerrar sesión
    </button>
  </header>

  <main class="max-w-2xl mx-auto mt-12 px-4">
    @if (currentUser(); as user) {
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Mi perfil</h2>
        <dl class="space-y-2 text-sm text-gray-700">
          <div class="flex gap-2">
            <dt class="font-medium w-24">Nombre</dt>
            <dd>{{ user.name }}</dd>
          </div>
          <div class="flex gap-2">
            <dt class="font-medium w-24">Email</dt>
            <dd>{{ user.email }}</dd>
          </div>
          <div class="flex gap-2">
            <dt class="font-medium w-24">Roles</dt>
            <dd>{{ user.roles.join(', ') || '—' }}</dd>
          </div>
        </dl>
      </div>
    } @else {
      <p class="text-sm text-gray-400">Cargando perfil...</p>
    }
  </main>
</div>
