<div class="p-4 sm:p-8">
  <!-- Page header -->
  <div class="mb-8">
    <h1 class="text-xl font-semibold text-gray-900">Dashboard</h1>
    <p class="mt-0.5 text-sm text-gray-400">
      Bienvenido de vuelta{{ currentUser() ? ', ' + currentUser()!.name : '' }}.
    </p>
  </div>

  <!-- Profile card -->
  @if (currentUser(); as user) {
    <div class="max-w-sm rounded-xl border border-gray-200 bg-white p-6">
      <div class="flex items-center gap-4 mb-5">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-900 text-base font-semibold text-white"
        >
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-900">{{ user.name }}</p>
          <p class="text-xs text-gray-400">{{ user.email ?? '—' }}</p>
        </div>
      </div>
      <div class="space-y-2 border-t border-gray-100 pt-4">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Usuario</span>
          <span class="font-medium text-gray-700">{{ user.username }}</span>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-400">Rol</span>
          <span
            class="inline-flex items-center rounded-md bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700"
          >
            {{ user.roles[0] || '—' }}
          </span>
        </div>
      </div>
    </div>
  } @else {
    <div class="h-40 max-w-sm rounded-xl border border-gray-200 bg-white animate-pulse"></div>
  }
</div>
